<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hamdan Al Darei</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="light-mode">
  <div class="desert-background">
    <div class="sun"></div>
    <div class="moon"></div>
    <div class="stars"></div>
    <div class="dune dune-1"></div>
    <div class="dune dune-2"></div>
    <div class="dune dune-3"></div>
    <div class="dune dune-4"></div>
    <div class="oasis">
      <div class="water"></div>
      <div class="palm palm-1"></div>
      <div class="palm palm-2"></div>
      <div class="palm palm-3"></div>
    </div>
  </div>

  <div class="theme-toggle">
    <input type="checkbox" id="theme-switch" class="theme-switch-checkbox">
    <label for="theme-switch" class="theme-switch-label">
      <span class="theme-switch-inner"></span>
      <span class="theme-switch-switch"></span>
    </label>
  </div>

  <div class="content">
    <h1>Hamdan Al Darei</h1>
    <p>Computer Science @ GW, specializing in Machine Learning and Data Engineering.</p>

    <h2>Projects</h2>
    <ul>
      <li>Mini Shell (C)</li>
      <li>Camel Racing Analytics Platform</li>
      <li>Road Safety Companion App</li>
    </ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
